<div class="card shadow p-3" style="width: 400px; height: 300px; background-color: rgba(255,255,255,0.95);">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>Sistema de dados FORD</span>
        <button class="btn-close" (click)="fecharCard()" aria-label="Fechar"></button>
    </div>
    <div class="card-body">
        <p class="mb-1" style="white-space: nowrap;">
            Bem-vindo(a), <strong>{{ nomeUsuario }}</strong>!
        </p>
        <p class="small mb-5 text-dark" style="line-height: 1.6;">
            Gerencie informações, visualize gráficos e acesse relatórios da frota Ford.
        </p>
    </div>
</div>
